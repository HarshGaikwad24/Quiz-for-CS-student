<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeVerse · CS Quiz Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0015;
            padding: 20px;
            cursor: default;
            position: relative;
        }

        /* ===== BACKGROUND ORBS ===== */
        body::before {
            content: "";
            position: fixed;
            width: 600px;
            height: 600px;
            background: #9d4edd;
            border-radius: 50%;
            filter: blur(180px);
            top: -200px;
            left: -200px;
            opacity: 0.20;
            z-index: 0;
            animation: orbPulse 6s ease-in-out infinite alternate;
        }

        body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #00f0ff;
            border-radius: 50%;
            filter: blur(180px);
            bottom: -150px;
            right: -150px;
            opacity: 0.18;
            z-index: 0;
            animation: orbPulse 8s ease-in-out infinite alternate-reverse;
        }

        @keyframes orbPulse {
            0% {
                transform: scale(1);
                opacity: 0.18;
            }
            100% {
                transform: scale(1.2);
                opacity: 0.30;
            }
        }

        /* ===== FLOATING PARTICLES ===== */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .bg-particle {
            position: absolute;
            border-radius: 50%;
            animation: floatUp linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }

        /* ===== LOADING SCREEN ===== */
        #loadingScreen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #0a0015;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #loadingScreen.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 6px solid rgba(157, 78, 221, 0.2);
            border-top: 6px solid #00f0ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            margin-bottom: 30px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: #00f0ff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            animation: textPulse 1.5s ease-in-out infinite;
        }

        @keyframes textPulse {
            0%,
            100% {
                opacity: 0.7;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        .loading-quiz-icon {
            font-size: 48px;
            margin-bottom: 15px;
            animation: iconFloat 2s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        .loading-sub {
            color: #9d4edd;
            font-size: 14px;
            margin-top: 8px;
            letter-spacing: 2px;
            font-weight: 400;
            opacity: 0.7;
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            z-index: 10;
            position: relative;
            perspective: 1000px;
            opacity: 0;
            transition: opacity 1s ease 0.3s;
        }

        .container.show {
            opacity: 1;
        }

        .login-card {
            background: linear-gradient(145deg, rgba(20, 10, 40, 0.92), rgba(30, 15, 50, 0.92));
            backdrop-filter: blur(20px);
            border: 2px solid #9d4edd;
            border-radius: 0;
            padding: 44px 38px 50px;
            box-shadow:
                0 0 40px rgba(157, 78, 221, 0.5),
                0 0 80px rgba(0, 240, 255, 0.25),
                inset 0 0 30px rgba(157, 78, 221, 0.08);
            animation: cardDrift 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        @keyframes cardDrift {
            from {
                opacity: 0;
                transform: translateY(40px) skewY(-2deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) skewY(0);
            }
        }

        .card-content {
            position: relative;
            z-index: 2;
        }

        /* ===== BACK BUTTON — Logo Style, Top-Left Corner ===== */
        .back-btn-wrapper {
            position: absolute;
            top: 8px;
            left: 10px;
            z-index: 5;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.10);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            color: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            position: relative;
            overflow: hidden;
        }

        .back-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 10px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.3), rgba(0, 240, 255, 0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .back-btn:hover::before {
            opacity: 1;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(157, 78, 221, 0.3);
            transform: translateX(-2px) scale(1.05);
            box-shadow: 0 6px 25px rgba(157, 78, 221, 0.15), 0 0 30px rgba(0, 240, 255, 0.05);
            color: #fff;
        }

        .back-btn:active {
            transform: translateX(-1px) scale(0.95);
        }

        .back-btn .back-icon {
            font-size: 18px;
            line-height: 1;
            transition: transform 0.3s ease;
        }

        .back-btn:hover .back-icon {
            transform: translateX(-3px);
        }

        /* Back button glow ring */
        .back-btn::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 12px;
            background: radial-gradient(ellipse at center, rgba(0, 240, 255, 0.08), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .back-btn:hover::after {
            opacity: 1;
        }

        /* ===== COMPUTER ICON ===== */
        .computer-icon-wrapper {
            margin: 0 auto 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: computerFloat 3s ease-in-out infinite;
        }

        @keyframes computerFloat {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .computer-icon {
            position: relative;
            width: 90px;
            height: 82px;
            filter: drop-shadow(0 0 25px rgba(0, 240, 255, 0.6)) drop-shadow(0 0 50px rgba(157, 78, 221, 0.4));
            animation: computerGlow 2.5s ease-in-out infinite alternate;
        }

        @keyframes computerGlow {
            0% {
                filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.5)) drop-shadow(0 0 40px rgba(157, 78, 221, 0.3));
            }
            100% {
                filter: drop-shadow(0 0 40px rgba(0, 240, 255, 0.9)) drop-shadow(0 0 80px rgba(157, 78, 221, 0.6));
            }
        }

        .monitor {
            position: relative;
            width: 90px;
            height: 68px;
            background: linear-gradient(160deg, #0d0a1a, #1a1030);
            border: 3px solid #9d4edd;
            border-radius: 8px 8px 4px 4px;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(157, 78, 221, 0.15), 0 0 20px rgba(0, 240, 255, 0.2);
        }

        .monitor::after {
            content: '';
            position: absolute;
            inset: 4px;
            border-radius: 4px;
            background: radial-gradient(ellipse at center, rgba(0, 240, 255, 0.06), transparent 70%);
            pointer-events: none;
            animation: screenPulse 3s ease-in-out infinite;
        }

        @keyframes screenPulse {
            0%,
            100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }

        .code-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, #00f0ff, #9d4edd, transparent);
            border-radius: 2px;
            animation: codeScroll linear infinite;
            opacity: 0.7;
        }

        .code-line:nth-child(1) {
            width: 60%;
            top: 18%;
            left: 10%;
            animation-duration: 2.2s;
            animation-delay: 0s;
        }
        .code-line:nth-child(2) {
            width: 40%;
            top: 38%;
            left: 15%;
            animation-duration: 2.8s;
            animation-delay: 0.6s;
            background: linear-gradient(90deg, #9d4edd, #00f0ff, transparent);
        }
        .code-line:nth-child(3) {
            width: 70%;
            top: 58%;
            left: 8%;
            animation-duration: 2.0s;
            animation-delay: 1.2s;
        }
        .code-line:nth-child(4) {
            width: 25%;
            top: 76%;
            left: 20%;
            animation-duration: 3.0s;
            animation-delay: 0.3s;
            background: linear-gradient(90deg, #00f0ff, #9d4edd, transparent);
        }

        @keyframes codeScroll {
            0% {
                transform: translateX(-120%);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            80% {
                opacity: 0.8;
            }
            100% {
                transform: translateX(200%);
                opacity: 0;
            }
        }

        .cursor-blink {
            position: absolute;
            bottom: 14%;
            right: 16%;
            width: 3px;
            height: 10px;
            background: #00f0ff;
            border-radius: 2px;
            box-shadow: 0 0 12px #00f0ff;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .stand {
            width: 20px;
            height: 12px;
            margin: 0 auto;
            background: linear-gradient(180deg, #5a3a7a, #3a1f5a);
            border-radius: 0 0 6px 6px;
            border-left: 2px solid #7a4a9a;
            border-right: 2px solid #7a4a9a;
            border-bottom: 2px solid #7a4a9a;
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.3);
        }

        .base {
            width: 40px;
            height: 4px;
            margin: 0 auto;
            background: linear-gradient(90deg, #4a2a6a, #8a5aaa, #4a2a6a);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.3);
            opacity: 0.7;
        }

        .power-led {
            position: absolute;
            bottom: 6px;
            right: 8px;
            width: 5px;
            height: 5px;
            background: #00f0ff;
            border-radius: 50%;
            box-shadow: 0 0 12px #00f0ff, 0 0 24px #00f0ff;
            animation: ledPulse 1.8s ease-in-out infinite;
        }

        @keyframes ledPulse {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(0.9);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* ===== TYPOGRAPHY ===== */
        .card-title {
            color: #00f0ff;
            font-size: 38px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 2px;
            text-shadow: 0 0 10px #00f0ff, 0 0 20px #9d4edd, 2px 2px 0 #9d4edd;
        }

        .card-title span {
            font-size: 28px;
            color: #9d4edd;
            text-shadow: 0 0 15px #9d4edd;
        }

        .card-subtitle {
            color: #9d4edd;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 32px;
            font-weight: 700;
            text-shadow: 0 0 12px rgba(157, 78, 221, 0.7);
        }

        /* ===== FORM ELEMENTS ===== */
        .form-group {
            margin-bottom: 18px;
            animation: formFade 0.6s ease-out;
        }

        .form-group:nth-child(1) {
            animation-delay: 0.05s;
        }
        .form-group:nth-child(2) {
            animation-delay: 0.10s;
        }
        .form-group:nth-child(3) {
            animation-delay: 0.13s;
        }
        .form-group:nth-child(4) {
            animation-delay: 0.16s;
        }
        .form-group:nth-child(5) {
            animation-delay: 0.19s;
        }
        .form-group:nth-child(6) {
            animation-delay: 0.22s;
        }

        @keyframes formFade {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        label {
            display: block;
            color: #00f0ff;
            font-size: 11px;
            font-weight: 900;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
            text-align: left;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #9d4edd;
            border-radius: 0;
            background: rgba(157, 78, 221, 0.05);
            color: #00f0ff;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.5px;
        }

        input::placeholder {
            color: rgba(157, 78, 221, 0.4);
        }

        input:focus {
            outline: none;
            border-color: #00f0ff;
            background: rgba(0, 240, 255, 0.07);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5), 0 0 40px rgba(157, 78, 221, 0.3), inset 0 0 15px rgba(0, 240, 255,
                    0.08);
            transform: translateY(-3px) skewX(-1deg);
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(157, 78, 221, 0.6);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 6px;
            transition: color 0.3s ease;
            font-family: 'Poppins', sans-serif;
            line-height: 1;
        }

        .toggle-password:hover {
            color: #00f0ff;
        }

        .toggle-password:focus {
            outline: none;
        }

        /* ===== BUTTON ===== */
        .login-btn {
            position: relative;
            width: 100%;
            padding: 18px 40px;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #9d4edd 0%, #00f0ff 100%);
            color: #0a0015;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), 0 0 30px rgba(157, 78, 221, 0.4), 0 0 60px rgba(0, 240, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 6px;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.30), transparent);
            transition: left 0.6s ease;
            pointer-events: none;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4), 0 0 50px rgba(157, 78, 221, 0.7), 0 0 80px rgba(0, 240, 255, 0.4);
        }

        .login-btn:active {
            transform: translateY(-1px) scale(1.01);
        }

        .ripple-effect {
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.45);
            border-radius: 50%;
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to {
                transform: scale(12);
                opacity: 0;
            }
        }

        .error-msg {
            margin-top: 14px;
            color: #ff5252;
            font-size: 13px;
            font-weight: 600;
            min-height: 22px;
            text-shadow: 0 0 20px rgba(255, 82, 82, 0.4);
            transition: all 0.3s ease;
        }

        .success-msg {
            margin-top: 14px;
            color: #34d399;
            font-size: 13px;
            font-weight: 600;
            min-height: 22px;
            text-shadow: 0 0 20px rgba(52, 211, 153, 0.4);
            transition: all 0.3s ease;
        }

        /* ===== CONFETTI CANVAS ===== */
        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        /* ===== LOGIN LINK ===== */
        .login-link {
            margin-top: 22px;
            color: rgba(157, 78, 221, 0.7);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .login-link a {
            color: #00f0ff;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            cursor: pointer;
        }

        .login-link a:hover {
            color: #9d4edd;
            text-shadow: 0 0 25px rgba(157, 78, 221, 0.6);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 520px) {
            .login-card {
                padding: 32px 22px 38px;
            }
            .card-title {
                font-size: 30px;
                letter-spacing: 2px;
            }
            .card-title span {
                font-size: 22px;
            }
            .computer-icon {
                width: 72px;
                height: 66px;
            }
            .monitor {
                width: 72px;
                height: 54px;
            }
            .login-btn {
                font-size: 13px;
                padding: 15px 28px;
            }
            .container {
                padding: 12px;
            }
            .back-btn {
                width: 36px;
                height: 36px;
                border-radius: 8px;
            }
            .back-btn .back-icon {
                font-size: 16px;
            }
            .back-btn-wrapper {
                top: 6px;
                left: 8px;
            }
        }

        @media (max-width: 380px) {
            .card-title {
                font-size: 24px;
            }
            .card-title span {
                font-size: 18px;
            }
            .computer-icon {
                width: 60px;
                height: 56px;
            }
            .monitor {
                width: 60px;
                height: 46px;
            }
            .back-btn {
                width: 32px;
                height: 32px;
                border-radius: 6px;
            }
            .back-btn .back-icon {
                font-size: 14px;
            }
            .back-btn-wrapper {
                top: 5px;
                left: 6px;
            }
        }

        /* ===== REDIRECT OVERLAY ===== */
        .redirect-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(10, 0, 21, 0.92);
            backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: fadeInOverlay 0.5s ease-out;
        }

        .redirect-overlay.show {
            display: flex;
        }

        @keyframes fadeInOverlay {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .redirect-overlay .redirect-icon {
            font-size: 64px;
            margin-bottom: 16px;
            animation: bounceIcon 1s ease-in-out infinite;
        }

        @keyframes bounceIcon {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        .redirect-overlay .redirect-text {
            color: #00f0ff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
        }

        .redirect-overlay .redirect-sub {
            color: rgba(157, 78, 221, 0.5);
            font-size: 14px;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        .redirect-overlay .redirect-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(157, 78, 221, 0.15);
            border-top: 4px solid #00f0ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 20px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
        }
    </style>
</head>
<body>

    <!-- ===== LOADING SCREEN ===== -->
    <div id="loadingScreen">
        <div class="loading-quiz-icon">📝</div>
        <div class="loading-spinner"></div>
        <div class="loading-text">Preparing Registration</div>
        <div class="loading-sub">Setting up your CodeVerse profile</div>
    </div>

    <!-- ===== FLOATING PARTICLES ===== -->
    <div class="bg-particles" id="bgParticles"></div>

    <!-- ===== CONFETTI CANVAS ===== -->
    <canvas id="confettiCanvas"></canvas>

    <!-- ===== REDIRECT OVERLAY ===== -->
    <div class="redirect-overlay" id="redirectOverlay">
        <span class="redirect-icon">🚀</span>
        <span class="redirect-text">Registration Successful!</span>
        <span class="redirect-sub">Redirecting you to the login page...</span>
        <div class="redirect-spinner"></div>
    </div>

    <!-- ===== MAIN CARD ===== -->
    <div class="container" id="mainContainer">
        <div class="login-card">
            <div class="card-content">

                <!-- ===== BACK BUTTON — Top-Left Corner ===== -->
                <div class="back-btn-wrapper">
                    <a href="quiz login page.html" class="back-btn" aria-label="Go back">
                        <span class="back-icon">←</span>
                    </a>
                </div>

                <!-- ===== COMPUTER ICON ===== -->
                <div class="computer-icon-wrapper">
                    <div class="computer-icon">
                        <div class="monitor">
                            <div class="code-line"></div>
                            <div class="code-line"></div>
                            <div class="code-line"></div>
                            <div class="code-line"></div>
                            <div class="cursor-blink"></div>
                            <div class="power-led"></div>
                        </div>
                        <div class="stand"></div>
                        <div class="base"></div>
                    </div>
                </div>

                <h1 class="card-title">CODEVERSE <span>·</span> REG</h1>
                <p class="card-subtitle">⚡ Join the CS Quiz ⚡</p>

                <!-- ===== FORM ===== -->
                <form id="registerForm">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Alex Rivera" required />
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="coder@cyber.space" required />
                    </div>

                    <div class="form-group">
                        <label for="std">SEM</label>
                        <input type="text" id="std" name="std" placeholder="3rd Sem" required />
                    </div>

                    <div class="form-group">
                        <label for="rollno">Roll No</label>
                        <input type="text" id="rollno" name="rollno" placeholder="R2024001" required />
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" placeholder="••••••••" required />
                            <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">👁</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required />
                            <button type="button" class="toggle-password" id="toggleConfirmPassword" aria-label="Toggle confirm password visibility">👁</button>
                        </div>
                    </div>

                    <button type="submit" class="login-btn" id="registerBtn">
                        <span>🚀</span> Register Now <span>💻</span>
                    </button>

                    <div id="formFeedback"></div>

                    <div class="login-link">
                        Already have an account? <a id="goToLoginLink">Log in →</a>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ===== 1. LOADING SCREEN TRANSITION =====
            const loadingScreen = document.getElementById('loadingScreen');
            const mainContainer = document.getElementById('mainContainer');

            setTimeout(function() {
                loadingScreen.classList.add('hide');
                mainContainer.classList.add('show');
            }, 2500);

            // ===== 2. BACKGROUND PARTICLES =====
            const particleContainer = document.getElementById('bgParticles');
            const colors = ['#9d4edd', '#00f0ff', '#7a4aaa', '#3af0ff', '#c084fc'];

            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'bg-particle';
                const size = Math.random() * 6 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.animationDuration = (Math.random() * 14 + 8) + 's';
                p.style.animationDelay = (Math.random() * 12) + 's';
                p.style.boxShadow = '0 0 12px ' + p.style.background;
                particleContainer.appendChild(p);
            }

            // ===== 3. CONFETTI =====
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let animId = null;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class ConfettiParticle {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.size = Math.random() * 10 + 5;
                    this.speedX = (Math.random() - 0.5) * 14;
                    this.speedY = Math.random() * -18 - 6;
                    this.gravity = 0.35;
                    this.rotation = Math.random() * 360;
                    this.rotationSpeed = (Math.random() - 0.5) * 16;
                    this.color = ['#9d4edd', '#00f0ff', '#fbbf24', '#ff6b6b', '#ffffff', '#34d399'][Math.floor(Math
                        .random() * 6)];
                    this.opacity = 1;
                    this.fade = 0.012;
                    this.shape = Math.random() > 0.5 ? 'rect' : 'circle';
                }

                update() {
                    this.speedY += this.gravity;
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.rotation += this.rotationSpeed;
                    this.opacity -= this.fade;
                }

                draw(ctx) {
                    ctx.save();
                    ctx.globalAlpha = this.opacity;
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation * Math.PI / 180);
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 8;
                    if (this.shape === 'rect') {
                        ctx.fillRect(-this.size / 2, -this.size / 4, this.size, this.size / 2);
                    } else {
                        ctx.beginPath();
                        ctx.arc(0, 0, this.size / 2, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                    ctx.restore();
                }

                get dead() {
                    return this.opacity <= 0 || this.y > window.innerHeight + 50;
                }
            }

            function launchConfetti(x, y, count) {
                count = count || 120;
                for (let i = 0; i < count; i++) {
                    particles.push(new ConfettiParticle(x, y));
                }
                if (!animId) animateConfetti();
            }

            function animateConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles = particles.filter(function(p) { return !p.dead; });
                particles.forEach(function(p) {
                    p.update();
                    p.draw(ctx);
                });
                if (particles.length > 0) {
                    animId = requestAnimationFrame(animateConfetti);
                } else {
                    animId = null;
                }
            }

            function stopConfetti() {
                if (animId) cancelAnimationFrame(animId);
                animId = null;
                particles = [];
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            // ===== 4. RIPPLE EFFECT =====
            const registerBtn = document.getElementById('registerBtn');

            registerBtn.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                ripple.className = 'ripple-effect';
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                ripple.style.left = (x - 10) + 'px';
                ripple.style.top = (y - 10) + 'px';
                this.appendChild(ripple);
                setTimeout(function() { ripple.remove(); }, 700);
            });

            // ===== 5. TOGGLE PASSWORD VISIBILITY =====
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');

            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.textContent = type === 'password' ? '👁' : '👁‍🗨';
            });

            const toggleConfirm = document.getElementById('toggleConfirmPassword');
            const confirmInput = document.getElementById('confirmPassword');

            toggleConfirm.addEventListener('click', function() {
                const type = confirmInput.getAttribute('type') === 'password' ? 'text' : 'password';
                confirmInput.setAttribute('type', type);
                this.textContent = type === 'password' ? '👁' : '👁‍🗨';
            });

            // ===== 6. REDIRECT FUNCTION =====
            function redirectToLogin() {
                const overlay = document.getElementById('redirectOverlay');
                overlay.classList.add('show');

                // Hide the main card with a fade
                const card = document.querySelector('.login-card');
                card.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                card.style.opacity = '0';
                card.style.transform = 'scale(0.95)';

                setTimeout(function() {
                    window.location.href = 'quiz login page.html';
                }, 2200);
            }

            // ===== 7. REGISTRATION VALIDATION + CONFETTI BURST =====
            const form = document.getElementById('registerForm');
            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const stdInput = document.getElementById('std');
            const rollnoInput = document.getElementById('rollno');
            const feedbackEl = document.getElementById('formFeedback');
            const goToLoginLink = document.getElementById('goToLoginLink');

            // Go to login link
            goToLoginLink.addEventListener('click', function(e) {
                e.preventDefault();
                redirectToLogin();
            });

            const clearFeedback = function() {
                feedbackEl.className = '';
                feedbackEl.textContent = '';
            };
            nameInput.addEventListener('input', clearFeedback);
            emailInput.addEventListener('input', clearFeedback);
            stdInput.addEventListener('input', clearFeedback);
            rollnoInput.addEventListener('input', clearFeedback);
            passwordInput.addEventListener('input', clearFeedback);
            confirmInput.addEventListener('input', clearFeedback);

            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const name = nameInput.value.trim();
                const email = emailInput.value.trim();
                const std = stdInput.value.trim();
                const rollno = rollnoInput.value.trim();
                const password = passwordInput.value;
                const confirm = confirmInput.value;

                feedbackEl.className = '';
                feedbackEl.textContent = '';

                // --- Validation in order: Name → Email → SEM → Roll No → Password → Confirm ---
                if (!name) {
                    feedbackEl.className = 'error-msg';
                    feedbackEl.textContent = '⚠️ Enter your full name';
                    nameInput.focus();
                    return;
                }

                if (name.length < 2) {
                    feedbackEl.className = 'error-msg';
                    feedbackEl.textContent = '⚠️ Name must be at least 2 characters';
                    nameInput.focus();
                    return;
                }

                if (!email) {
                    feedbackEl.className = 'error-msg';
                    feedbackEl.textContent = '⚠️ Enter your email address';
                    emailInput.focus();
                    return;
                }

                if (!email.includes('@') || !email.includes('.')) {
                    feedbackEl.className = 'error-msg';
                    feedbackEl.textContent = '⚠️ Please enter a valid email address';
                    emailInput.focus();
                    return;
                }

                if (!std) {
                    feedbackEl.className = 'error-msg';
                    feedbackEl.textContent = '⚠️ Enter your SEM';
                    stdInput.focus();
                    return;
                }

                if (!rollno) {
                    feedbackEl.className = 'error-msg';
                    feedbackEl.textContent = '⚠️ Enter your roll number';
                    rollnoInput.focus();
                    return;
                }

                if (!password) {
                    feedbackEl.className = 'error-msg';
                    feedbackEl.textContent = '⚠️ Create a password';
                    passwordInput.focus();
                    return;
                }

                if (password.length < 6) {
                    feedbackEl.className = 'error-msg';
                    feedbackEl.textContent = '⚠️ Password must be at least 6 characters';
                    passwordInput.focus();
                    return;
                }

                if (!confirm) {
                    feedbackEl.className = 'error-msg';
                    feedbackEl.textContent = '⚠️ Please confirm your password';
                    confirmInput.focus();
                    return;
                }

                if (password !== confirm) {
                    feedbackEl.className = 'error-msg';
                    feedbackEl.textContent = '⚠️ Passwords do not match';
                    confirmInput.focus();
                    return;
                }

                // ===== SUCCESS — Launch Confetti & Redirect =====
                const cx = window.innerWidth / 2;
                const cy = window.innerHeight / 2;
                launchConfetti(cx, cy, 180);

                const btnRect = registerBtn.getBoundingClientRect();
                const bx = btnRect.left + btnRect.width / 2;
                const by = btnRect.top + btnRect.height / 2;
                setTimeout(function() { launchConfetti(bx, by, 80); }, 300);

                feedbackEl.className = 'success-msg';
                feedbackEl.textContent = '✅ Registration successful! Redirecting to login...';

                // Show redirect overlay after a short delay
                setTimeout(function() {
                    redirectToLogin();
                }, 800);
            });

        })();
    </script>

</body>
</html>
