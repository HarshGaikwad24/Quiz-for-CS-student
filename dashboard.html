<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeVerse · Multi‑Subject Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: #0a0015;
            color: #fff;
            padding: 0;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body::before {
            content: "";
            position: fixed;
            width: 700px;
            height: 700px;
            background: #9d4edd;
            border-radius: 50%;
            filter: blur(200px);
            top: -300px;
            left: -300px;
            opacity: 0.12;
            z-index: 0;
            animation: orbPulse 7s ease-in-out infinite alternate;
        }

        body::after {
            content: "";
            position: fixed;
            width: 600px;
            height: 600px;
            background: #00f0ff;
            border-radius: 50%;
            filter: blur(200px);
            bottom: -250px;
            right: -250px;
            opacity: 0.10;
            z-index: 0;
            animation: orbPulse 9s ease-in-out infinite alternate-reverse;
        }

        @keyframes orbPulse {
            0% {
                transform: scale(1);
                opacity: 0.10;
            }
            100% {
                transform: scale(1.3);
                opacity: 0.20;
            }
        }

        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .bg-particle {
            position: absolute;
            border-radius: 50%;
            animation: floatUp linear infinite;
            opacity: 0;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 0.6;
            }
            85% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(720deg);
                opacity: 0;
            }
        }

        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
        }
        @keyframes twinkle {
            0%, 100% {
                opacity: 0.2;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.8);
            }
        }

        /* ===== LOADING OVERLAY ===== */
        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #0a0015;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loading-overlay.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-overlay .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(157, 78, 221, 0.2);
            border-top: 4px solid #00f0ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
            margin-bottom: 24px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-overlay .load-text {
            color: #00f0ff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            animation: textPulse 1.5s ease-in-out infinite;
        }

        @keyframes textPulse {
            0%, 100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
            padding: 20px 20px 40px;
            animation: fadeUp 0.8s ease-out;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== HEADER – STICKY ===== */
        .header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #0a0015;
            padding: 12px 0 14px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(157, 78, 221, 0.15);
            text-align: center;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
        }
        .header .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #00f0ff;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.4), 0 0 60px rgba(157, 78, 221, 0.2);
        }
        .header .logo span {
            color: #9d4edd;
        }
        .header .subtitle {
            color: rgba(157, 78, 221, 0.6);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 2px;
            font-weight: 600;
        }
        .header .user-badge {
            font-size: 13px;
            color: #00f0ff;
            background: rgba(0, 240, 255, 0.06);
            padding: 4px 16px;
            border-radius: 30px;
            border: 1px solid rgba(0, 240, 255, 0.1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .back-btn {
            color: #9d4edd;
            background: rgba(157, 78, 221, 0.08);
            border: 1px solid rgba(157, 78, 221, 0.15);
            padding: 6px 18px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn:hover {
            background: rgba(157, 78, 221, 0.15);
            border-color: rgba(157, 78, 221, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.15);
            color: #fff;
        }

        /* ============================================================
           DASHBOARD
           ============================================================ */
        .dashboard-container {
            display: block;
            animation: fadeUp 0.6s ease-out;
        }

        /* ── Subject Selector ── */
        .subject-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 20px 0 30px;
        }
        @media (max-width: 640px) {
            .subject-selector {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 420px) {
            .subject-selector {
                grid-template-columns: 1fr;
            }
        }

        .subject-card {
            background: linear-gradient(145deg, rgba(20, 10, 40, 0.88), rgba(30, 15, 50, 0.88));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(157, 78, 221, 0.15);
            border-radius: 16px;
            padding: 24px 18px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }
        .subject-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(157, 78, 221, 0.3);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 40px rgba(157, 78, 221, 0.1);
        }
        .subject-card:active {
            transform: scale(0.96);
        }
        .subject-card .subject-icon {
            font-size: 44px;
            display: block;
            margin-bottom: 8px;
        }
        .subject-card .subject-name {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 2px;
        }
        .subject-card .subject-desc {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }
        .subject-card .subject-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(0, 240, 255, 0.06);
            color: #00f0ff;
            border: 1px solid rgba(0, 240, 255, 0.1);
        }

        /* ── MY SCORE CARD ── */
        .my-score-card {
            background: linear-gradient(145deg, rgba(20, 10, 40, 0.92), rgba(30, 15, 50, 0.92));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(157, 78, 221, 0.12);
            border-radius: 16px;
            padding: 22px 26px 24px;
            margin-bottom: 24px;
        }
        .my-score-card .msc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .my-score-card .msc-title {
            font-size: 18px;
            font-weight: 700;
            color: #00f0ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .my-score-card .msc-title span {
            color: #9d4edd;
        }
        .my-score-card .msc-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        @media (max-width: 640px) {
            .my-score-card .msc-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 420px) {
            .my-score-card .msc-grid {
                grid-template-columns: 1fr;
            }
        }
        .my-score-card .msc-item {
            background: rgba(157, 78, 221, 0.04);
            border: 1px solid rgba(157, 78, 221, 0.08);
            border-radius: 12px;
            padding: 14px 12px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .my-score-card .msc-item:hover {
            border-color: rgba(157, 78, 221, 0.2);
            transform: translateY(-2px);
        }
        .my-score-card .msc-item .msc-icon {
            font-size: 28px;
            display: block;
            margin-bottom: 4px;
        }
        .my-score-card .msc-item .msc-sub {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .my-score-card .msc-item .msc-score {
            font-size: 28px;
            font-weight: 900;
            display: block;
            margin-top: 2px;
        }
        .my-score-card .msc-item .msc-score.high {
            color: #34d399;
        }
        .my-score-card .msc-item .msc-score.medium {
            color: #fbbf24;
        }
        .my-score-card .msc-item .msc-score.low {
            color: #ff6b6b;
        }
        .my-score-card .msc-item .msc-score.pending {
            color: rgba(255, 255, 255, 0.15);
        }
        .my-score-card .msc-item .msc-detail {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 2px;
        }
        .my-score-card .msc-item .msc-bar {
            width: 100%;
            height: 4px;
            background: rgba(157, 78, 221, 0.1);
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }
        .my-score-card .msc-item .msc-bar .msc-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 0%;
        }
        .my-score-card .msc-item .msc-bar .msc-bar-fill.high {
            background: linear-gradient(90deg, #34d399, #6ee7b7);
        }
        .my-score-card .msc-item .msc-bar .msc-bar-fill.medium {
            background: linear-gradient(90deg, #fbbf24, #fcd34d);
        }
        .my-score-card .msc-item .msc-bar .msc-bar-fill.low {
            background: linear-gradient(90deg, #ff6b6b, #f87171);
        }

        /* ── COMPARISON SECTION ── */
        .comparison-section {
            background: linear-gradient(145deg, rgba(20, 10, 40, 0.92), rgba(30, 15, 50, 0.92));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(157, 78, 221, 0.12);
            border-radius: 16px;
            padding: 22px 26px 24px;
            margin-bottom: 24px;
        }
        .comparison-section .comp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .comparison-section .comp-title {
            font-size: 18px;
            font-weight: 700;
            color: #00f0ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .comparison-section .comp-title span {
            color: #9d4edd;
        }
        .comparison-section .comp-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 640px) {
            .comparison-section .comp-grid {
                grid-template-columns: 1fr;
            }
        }
        .comparison-section .comp-item {
            background: rgba(157, 78, 221, 0.04);
            border: 1px solid rgba(157, 78, 221, 0.08);
            border-radius: 12px;
            padding: 16px 18px;
        }
        .comparison-section .comp-item .comp-label {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .comparison-section .comp-item .comp-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(157, 78, 221, 0.04);
        }
        .comparison-section .comp-item .comp-row:last-child {
            border-bottom: none;
        }
        .comparison-section .comp-item .comp-row .comp-name {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }
        .comparison-section .comp-item .comp-row .comp-name .me-badge {
            color: #00f0ff;
            font-weight: 700;
            margin-left: 4px;
        }
        .comparison-section .comp-item .comp-row .comp-val {
            font-size: 14px;
            font-weight: 700;
        }
        .comparison-section .comp-item .comp-row .comp-val.gold {
            color: #fbbf24;
        }
        .comparison-section .comp-item .comp-row .comp-val.cyan {
            color: #00f0ff;
        }
        .comparison-section .comp-item .comp-row .comp-val.green {
            color: #34d399;
        }
        .comparison-section .comp-item .comp-row .comp-val.red {
            color: #ff6b6b;
        }
        .comparison-section .comp-item .comp-row .comp-val.purple {
            color: #9d4edd;
        }

        /* ── Stats Grid ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }
        @media (max-width: 780px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        .stat-card {
            background: linear-gradient(145deg, rgba(20, 10, 40, 0.92), rgba(30, 15, 50, 0.92));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(157, 78, 221, 0.12);
            border-radius: 16px;
            padding: 20px 18px 22px;
            transition: all 0.3s ease;
            text-align: center;
        }
        .stat-card:hover {
            border-color: rgba(157, 78, 221, 0.25);
            transform: translateY(-3px);
        }
        .stat-card .sc-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 4px;
        }
        .stat-card .sc-title {
            font-size: 14px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .stat-card .sc-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .stat-card .sc-item {
            text-align: center;
        }
        .stat-card .sc-item .val {
            font-size: 24px;
            font-weight: 900;
            display: block;
            line-height: 1.2;
        }
        .stat-card .sc-item .val.gold {
            color: #fbbf24;
        }
        .stat-card .sc-item .val.cyan {
            color: #00f0ff;
        }
        .stat-card .sc-item .val.green {
            color: #34d399;
        }
        .stat-card .sc-item .val.purple {
            color: #9d4edd;
        }
        .stat-card .sc-item .val.pink {
            color: #f472b6;
        }
        .stat-card .sc-item .val.red {
            color: #ff6b6b;
        }
        .stat-card .sc-item .label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .stat-card .sc-empty {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.15);
            padding: 8px 0;
        }

        /* ── Overall Stats ── */
        .overall-stats {
            background: linear-gradient(145deg, rgba(20, 10, 40, 0.92), rgba(30, 15, 50, 0.92));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(157, 78, 221, 0.12);
            border-radius: 16px;
            padding: 22px 26px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .overall-stats .os-title {
            font-size: 15px;
            font-weight: 700;
            color: #00f0ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .overall-stats .os-items {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .overall-stats .os-item {
            text-align: center;
        }
        .overall-stats .os-item .val {
            font-size: 22px;
            font-weight: 900;
            display: block;
        }
        .overall-stats .os-item .val.gold {
            color: #fbbf24;
        }
        .overall-stats .os-item .val.cyan {
            color: #00f0ff;
        }
        .overall-stats .os-item .val.green {
            color: #34d399;
        }
        .overall-stats .os-item .label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .overall-stats .os-empty {
            color: rgba(255, 255, 255, 0.15);
            font-size: 14px;
        }

        /* ── Leaderboard ── */
        .leaderboard-section {
            background: linear-gradient(145deg, rgba(20, 10, 40, 0.92), rgba(30, 15, 50, 0.92));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(157, 78, 221, 0.12);
            border-radius: 16px;
            padding: 22px 26px 24px;
        }
        .leaderboard-section .lb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .leaderboard-section .lb-title {
            font-size: 18px;
            font-weight: 700;
            color: #00f0ff;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }
        .leaderboard-section .lb-title span {
            color: #9d4edd;
        }
        .leaderboard-section .lb-sub {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }

        .lb-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .lb-list::-webkit-scrollbar {
            width: 4px;
        }
        .lb-list::-webkit-scrollbar-track {
            background: rgba(157, 78, 221, 0.05);
            border-radius: 10px;
        }
        .lb-list::-webkit-scrollbar-thumb {
            background: #9d4edd;
            border-radius: 10px;
        }
        .lb-list::-webkit-scrollbar-thumb:hover {
            background: #00f0ff;
        }

        .lb-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 14px;
            background: rgba(157, 78, 221, 0.02);
            border: 1px solid rgba(157, 78, 221, 0.04);
            border-radius: 10px;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .lb-item:hover {
            background: rgba(157, 78, 221, 0.06);
            border-color: rgba(157, 78, 221, 0.1);
            transform: translateX(4px);
        }
        .lb-item .rank {
            font-size: 14px;
            font-weight: 900;
            min-width: 36px;
            color: rgba(255, 255, 255, 0.2);
        }
        .lb-item .rank.top1 {
            color: #fbbf24;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
        }
        .lb-item .rank.top2 {
            color: #c0c0c0;
            text-shadow: 0 0 20px rgba(192, 192, 192, 0.2);
        }
        .lb-item .rank.top3 {
            color: #cd7f32;
            text-shadow: 0 0 20px rgba(205, 127, 50, 0.2);
        }
        .lb-item .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            background: rgba(157, 78, 221, 0.12);
            color: #9d4edd;
            flex-shrink: 0;
            border: 1px solid rgba(157, 78, 221, 0.08);
        }
        .lb-item .avatar.gold {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            border-color: rgba(251, 191, 36, 0.2);
        }

<body>

    <!-- ===== LOADING OVERLAY ===== -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="load-text">Loading CodeVerse</div>
    </div>

    <!-- ===== STARS ===== -->
    <div class="stars-container" id="starsContainer"></div>
    <div class="bg-particles" id="bgParticles"></div>

    <!-- ============================================================
    MAIN CONTENT
    ============================================================ -->
    <div class="container" id="mainContainer">

        <!-- ===== HEADER – STICKY ===== -->
        <div class="header" id="stickyHeader">
            <div class="header-row">
                <div class="logo">
                    <span>⌨️</span> Code<span>Verse</span>
                </div>
                <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
                    <span class="user-badge">👤 <span id="currentUserDisplay">User</span></span>
                    <a href="quiz login page.html" class="back-btn">🔙 Back to Login</a>
                </div>
            </div>
            <div class="subtitle">⚡ Multi‑Subject Quiz Dashboard ⚡</div>
        </div>

        <!-- ============================================================
        DASHBOARD
        ============================================================ -->
        <div class="dashboard-container" id="dashboardContainer">

            <!-- Subject Selector -->
            <div class="subject-selector" id="subjectSelector">
                <!-- generated by JS -->
            </div>

            <!-- My Score Card -->
            <div class="my-score-card" id="myScoreCard">
                <div class="msc-header">
                    <div class="msc-title">📊 My <span>Score Card</span></div>
                    <span class="lb-sub" id="scoreCardTotal">—</span>
                </div>
                <div class="msc-grid" id="scoreCardGrid">
                    <!-- generated by JS -->
                </div>
            </div>

            <!-- Comparison Section -->
            <div class="comparison-section" id="comparisonSection">
                <div class="comp-header">
                    <div class="comp-title">📈 Score <span>Comparison</span></div>
                    <span class="lb-sub">You vs. Global Average</span>
                </div>
                <div class="comp-grid" id="comparisonGrid">
                    <!-- generated by JS -->
                </div>
            </div>

            <!-- Per-Subject Stats -->
            <div class="stats-grid" id="statsGrid">
                <!-- generated by JS -->
            </div>

            <!-- Overall Stats -->
            <div class="overall-stats" id="overallStats">
                <!-- generated by JS -->
            </div>

            <!-- Global Leaderboard -->
            <div class="leaderboard-section">
                <div class="lb-header">
                    <div class="lb-title">🏅 Global <span>Leaderboard</span></div>
                    <span class="lb-sub">based on highest score</span>
                </div>
                <div class="lb-list" id="leaderboardList">
                    <!-- generated by JS -->
                </div>
            </div>

            <!-- Actions -->
            <div class="dash-actions">
                <button class="nav-btn prev" id="clearHistoryBtn" style="margin:0;">
                    🗑️ Clear My History
                </button>
            </div>
        </div>

    </div>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ===== LOADING OVERLAY =====
            const loadingOverlay = document.getElementById('loadingOverlay');
            setTimeout(function() {
                loadingOverlay.classList.add('hide');
            }, 1200);

            // ==========================================================
            //  SUBJECT DATA
            // ==========================================================
            const subjectData = {
                python: {
                    name: 'Python',
                    icon: '🐍',
                    color: '#00f0ff',
                    redirect: 'python_quiz.html'
                },
                dbms: {
                    name: 'DBMS',
                    icon: '🗄️',
                    color: '#fbbf24',
                    redirect: 'dbms_quiz.html'
                },
                java: {
                    name: 'Java',
                    icon: '☕',
                    color: '#ff6b6b',
                    redirect: 'java_quiz.html'
                }
            };

            const subjectKeys = Object.keys(subjectData);

            // ==========================================================
            //  USER MANAGEMENT — NO GUEST FALLBACK
            // ==========================================================
            function getCurrentUser() {
                const user = localStorage.getItem('codeverse_current_user');
                if (!user) {
                    window.location.href = 'quiz login page.html';
                    return null;
                }
                return user;
            }

            // ==========================================================
            //  STORAGE — Per‑user history
            // ==========================================================
            const STORAGE_KEY = 'codeverse_users_data';

            function getAllUsersData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    return raw ? JSON.parse(raw) : {};
                } catch (e) {
                    return {};
                }
            }

            function saveAllUsersData(data) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }

            function getUserHistory(username) {
                const all = getAllUsersData();
                return all[username] || [];
            }

            function setUserHistory(username, history) {
                const all = getAllUsersData();
                all[username] = history;
                saveAllUsersData(all);
            }

            function clearUserHistory(username) {
                setUserHistory(username, []);
            }

            // ==========================================================
            //  COMPUTE STATS
            // ==========================================================
            function computeSubjectStats(history, subjectKey) {
                const attempts = history.filter(a => a.subject === subjectKey);
                if (attempts.length === 0) return null;
                const scores = attempts.map(a => a.score);
                const highest = Math.max(...scores);
                const avg = Math.round(scores.reduce((s, v) => s + v, 0) / scores.length);
                const corrects = attempts.map(a => a.correct);
                const totalCorrect = corrects.reduce((s, v) => s + v, 0);
                const totalQs = attempts.length * (attempts[0]?.total || 10);
                const totalWrong = totalQs - totalCorrect;
                const accuracy = Math.round((totalCorrect / totalQs) * 100);
                return {
                    attempts: attempts.length,
                    highest: highest,
                    avg: avg,
                    totalCorrect: totalCorrect,
                    totalWrong: totalWrong,
                    accuracy: accuracy,
                    passed: attempts.filter(a => a.passed).length
                };
            }

            function computeOverallStats(history) {
                if (history.length === 0) return null;
                const scores = history.map(a => a.score);
                const highest = Math.max(...scores);
                const avg = Math.round(scores.reduce((s, v) => s + v, 0) / scores.length);
                const totalCorrect = history.reduce((s, a) => s + a.correct, 0);
                const totalQs = history.reduce((s, a) => s + a.total, 0);
                const totalWrong = totalQs - totalCorrect;
                const accuracy = Math.round((totalCorrect / totalQs) * 100);
                const subMap = {};
                subjectKeys.forEach(k => { subMap[k] = []; });
                history.forEach(a => {
                    if (subMap[a.subject]) subMap[a.subject].push(a.score);
                });
                let bestSubject = '—';
                let bestAvg = -Infinity;
                for (const [k, arr] of Object.entries(subMap)) {
                    if (arr.length > 0) {
                        const avgSub = arr.reduce((s, v) => s + v, 0) / arr.length;
                        if (avgSub > bestAvg) {
                            bestAvg = avgSub;
                            bestSubject = k;
                        }
                    }
                }
                return {
                    attempts: history.length,
                    highest: highest,
                    avg: avg,
                    totalCorrect: totalCorrect,
                    totalWrong: totalWrong,
                    accuracy: accuracy,
                    bestSubject: bestSubject,
                    passed: history.filter(a => a.passed).length
                };
            }

            // ==========================================================
            //  GLOBAL LEADERBOARD — only real users
            // ==========================================================
            function getGlobalLeaderboard() {
                const allData = getAllUsersData();
                const users = [];
                for (const [username, history] of Object.entries(allData)) {
                    if (history.length > 0) {
                        const scores = history.map(a => a.score);
                        const best = Math.max(...scores);
                        const totalQs = history.reduce((s, a) => s + a.total, 0);
                        const totalCorrect = history.reduce((s, a) => s + a.correct, 0);
                        const accuracy = Math.round((totalCorrect / totalQs) * 100);
                        users.push({
                            name: username,
                            score: best,
                            attempts: history.length,
                            accuracy: accuracy,
                            isMe: username === getCurrentUser()
                        });
                    }
                }
                users.sort((a, b) => b.score - a.score);
                return users.slice(0, 20);
            }

            // ==========================================================
            //  GET GLOBAL AVERAGE
            // ==========================================================
            function getGlobalAverage() {
                const data = getGlobalLeaderboard();
                if (data.length === 0) return 0;
                const sum = data.reduce((s, u) => s + u.score, 0);
                return Math.round(sum / data.length);
            }

            // ==========================================================
            //  RENDER DASHBOARD
            // ==========================================================
            function renderDashboard() {
                const username = getCurrentUser();
                if (!username) return;

                document.getElementById('currentUserDisplay').textContent = username;

                renderSubjectCards();
                renderScoreCard();
                renderComparison();
                renderSubjectStats();
                renderOverallStats();
                renderLeaderboard();
            }

            // ==========================================================
            //  RENDER SUBJECT CARDS — redirect to instruction.html with subject param
            // ==========================================================
            function renderSubjectCards() {
                let html = '';
                subjectKeys.forEach(key => {
                    const sub = subjectData[key];
                    html += `
                        <div class="subject-card" data-subject="${key}">
                            <span class="subject-icon">${sub.icon}</span>
                            <div class="subject-name">${sub.name}</div>
                            <div class="subject-desc">10 questions</div>
                            <span class="subject-badge">🚀 Start Quiz</span>
                        </div>
                    `;
                });
                document.getElementById('subjectSelector').innerHTML = html;

                document.querySelectorAll('.subject-card').forEach(card => {
                    card.addEventListener('click', function() {
                        const subject = this.dataset.subject;
                        window.location.href = `instruction.html?subject=${subject}`;
                    });
                });
            }

            // ==========================================================
            //  RENDER SCORE CARD
            // ==========================================================
            function renderScoreCard() {
                const username = getCurrentUser();
                if (!username) return;
                const history = getUserHistory(username);
                const grid = document.getElementById('scoreCardGrid');
                const totalEl = document.getElementById('scoreCardTotal');

                let totalAttempts = 0;
                let totalBest = 0;

                let html = '';
                subjectKeys.forEach(key => {
                    const sub = subjectData[key];
                    const stats = computeSubjectStats(history, key);
                    const hasData = stats !== null;
                    const score = hasData ? stats.highest : 0;
                    const attempts = hasData ? stats.attempts : 0;
                    totalAttempts += attempts;
                    if (score > totalBest) totalBest = score;

                    let scoreClass = 'pending';
                    let barClass = '';
                    let barWidth = 0;
                    if (hasData) {
                        const maxScore = 40;
                        barWidth = Math.min((score / maxScore) * 100, 100);
                        if (score >= 30) { scoreClass = 'high';
                            barClass = 'high'; } else if (score >= 15) { scoreClass = 'medium';
                            barClass = 'medium'; } else { scoreClass = 'low';
                            barClass = 'low'; }
                    }

                    const displayScore = hasData ? score : '—';
                    const displayAttempts = hasData ? attempts : 0;

                    html += `
                        <div class="msc-item">
                            <span class="msc-icon">${sub.icon}</span>
                            <div class="msc-sub">${sub.name}</div>
                            <span class="msc-score ${scoreClass}">${displayScore}</span>
                            <div class="msc-detail">${displayAttempts} attempt${displayAttempts !== 1 ? 's' : ''}</div>
                            <div class="msc-bar">
                                <div class="msc-bar-fill ${barClass}" style="width:${barWidth}%;"></div>
                            </div>
                        </div>
                    `;
                });

                grid.innerHTML = html;
                totalEl.textContent = `🏆 Best: ${totalBest}  |  📋 Total: ${totalAttempts} attempts`;
            }

            // ==========================================================
            //  RENDER COMPARISON
            // ==========================================================
            function renderComparison() {
                const username = getCurrentUser();
                if (!username) return;
                const history = getUserHistory(username);
                const allData = getAllUsersData();

                const userSubScores = {};
                subjectKeys.forEach(key => {
                    const stats = computeSubjectStats(history, key);
                    userSubScores[key] = stats ? stats.highest : 0;
                });

                const globalSubScores = {};
                subjectKeys.forEach(key => {
                    let allScores = [];
                    for (const [u, h] of Object.entries(allData)) {
                        h.forEach(a => {
                            if (a.subject === key) allScores.push(a.score);
                        });
                    }
                    const avg = allScores.length > 0 ? Math.round(allScores.reduce((s, v) => s + v, 0) / allScores
                        .length) : 0;
                    globalSubScores[key] = avg;
                });

                const grid = document.getElementById('comparisonGrid');

                let html = '';
                subjectKeys.forEach(key => {
                    const sub = subjectData[key];
                    const userScore = userSubScores[key] || 0;
                    const globalAvg = globalSubScores[key] || 0;
                    const diff = userScore - globalAvg;
                    const diffClass = diff > 5 ? 'green' : (diff < -5 ? 'red' : 'gold');
                    const diffText = diff > 0 ? `+${diff}` : `${diff}`;

                    html += `
                        <div class="comp-item">
                            <div class="comp-label">${sub.icon} ${sub.name}</div>
                            <div class="comp-row">
                                <span class="comp-name">You <span class="me-badge">⭐</span></span>
                                <span class="comp-val cyan">${userScore}</span>
                            </div>
                            <div class="comp-row">
                                <span class="comp-name">Global Average</span>
                                <span class="comp-val gold">${globalAvg}</span>
                            </div>
                            <div class="comp-row" style="border-bottom:none; padding-top:4px;">
                                <span class="comp-name" style="font-size:11px; color:rgba(255,255,255,0.2);">Difference</span>
                                <span class="comp-val ${diffClass}" style="font-size:16px;">${diffText}</span>
                            </div>
                        </div>
                    `;
                });

                grid.innerHTML = html;
            }

            // ==========================================================
            //  RENDER SUBJECT STATS
            // ==========================================================
            function renderSubjectStats() {
                const username = getCurrentUser();
                if (!username) return;
                const history = getUserHistory(username);
                const grid = document.getElementById('statsGrid');

                let html = '';
                subjectKeys.forEach(key => {
                    const sub = subjectData[key];
                    const stats = computeSubjectStats(history, key);
                    const hasData = stats !== null;

                    html += `
                        <div class="stat-card">
                            <span class="sc-icon">${sub.icon}</span>
                            <div class="sc-title">${sub.name}</div>
                            ${hasData ? `
                                <div class="sc-row">
                                    <div class="sc-item">
                                        <span class="val gold">${stats.highest}</span>
                                        <span class="label">🏆 Highest</span>
                                    </div>
                                    <div class="sc-item">
                                        <span class="val cyan">${stats.attempts}</span>
                                        <span class="label">📋 Attempts</span>
                                    </div>
                                    <div class="sc-item">
                                        <span class="val green">${stats.avg}</span>
                                        <span class="label">📊 Average</span>
                                    </div>
                                    <div class="sc-item">
                                        <span class="val purple">${stats.accuracy}%</span>
                                        <span class="label">🎯 Accuracy</span>
                                    </div>
                                </div>
                            ` : `
                                <div class="sc-empty">No attempts yet.<br>Start the quiz!</div>
                            `}
                        </div>
                    `;
                });

                grid.innerHTML = html;
            }

            // ==========================================================
            //  RENDER OVERALL STATS
            // ==========================================================
            function renderOverallStats() {
                const username = getCurrentUser();
                if (!username) return;
                const history = getUserHistory(username);
                const stats = computeOverallStats(history);
                const container = document.getElementById('overallStats');

                if (!stats) {
                    container.innerHTML = `
                        <div class="os-title">📈 Overall Stats</div>
                        <div class="os-empty">No data yet. Take a quiz to see your stats!</div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <div class="os-title">📈 Overall Stats</div>
                    <div class="os-items">
                        <div class="os-item">
                            <span class="val gold">${stats.highest}</span>
                            <span class="label">🏆 Highest</span>
                        </div>
                        <div class="os-item">
                            <span class="val cyan">${stats.attempts}</span>
                            <span class="label">📋 Total Attempts</span>
                        </div>
                        <div class="os-item">
                            <span class="val green">${stats.avg}</span>
                            <span class="label">📊 Average</span>
                        </div>
                        <div class="os-item">
                            <span class="val purple">${stats.accuracy}%</span>
                            <span class="label">🎯 Accuracy</span>
                        </div>
                        <div class="os-item">
                            <span class="val pink">${stats.bestSubject !== '—' ? subjectData[stats.bestSubject]?.icon + ' ' + subjectData[stats.bestSubject]?.name || stats.bestSubject : '—'}</span>
                            <span class="label">🏅 Best Subject</span>
                        </div>
                        <div class="os-item">
                            <span class="val green">${stats.passed}</span>
                            <span class="label">✅ Passed</span>
                        </div>
                    </div>
                `;
            }

            // ==========================================================
            //  RENDER LEADERBOARD
            // ==========================================================
            function renderLeaderboard() {
                const data = getGlobalLeaderboard();
                const list = document.getElementById('leaderboardList');
                const username = getCurrentUser();

                if (data.length === 0) {
                    list.innerHTML = `
                        <div class="lb-empty">
                            <span class="empty-icon">📭</span>
                            No leaderboard data yet.
                        </div>
                    `;
                    return;
                }

                const medals = ['🥇', '🥈', '🥉'];
                let html = '';
                data.forEach((user, idx) => {
                    const rank = idx + 1;
                    let rankClass = '';
                    if (rank === 1) rankClass = 'top1';
                    else if (rank === 2) rankClass = 'top2';
                    else if (rank === 3) rankClass = 'top3';

                    let avatarClass = '';
                    if (rank === 1) avatarClass = 'gold';
                    else if (rank === 2) avatarClass = 'silver';
                    else if (rank === 3) avatarClass = 'bronze';

                    const nameClass = user.isMe ? 'me' : '';
                    const scoreClass = user.score >= 40 ? 'high' : (user.score < 20 ? 'low' : '');
                    const rankDisplay = rank <= 3 ? `${medals[rank-1]}` : `#${rank}`;
                    const initial = user.name.charAt(0).toUpperCase();
                    const youBadge = user.isMe ? `<span class="you-badge">⭐ You</span>` : '';

                    html += `
                        <div class="lb-item">
                            <span class="rank ${rankClass}">${rankDisplay}</span>
                            <span class="avatar ${avatarClass}">${initial}</span>
                            <div class="info">
                                <div class="name ${nameClass}">${user.name} ${youBadge}</div>
                                <div class="detail">
                                    <span>📋 ${user.attempts} attempts</span>
                                    <span>🎯 ${user.accuracy}% accuracy</span>
                                </div>
                            </div>
                            <span class="score ${scoreClass}">${user.score}</span>
                        </div>
                    `;
                });

                list.innerHTML = html;
            }

            // ==========================================================
            //  STARS & PARTICLES
            // ==========================================================
            function createStars() {
                const container = document.getElementById('starsContainer');
                for (let i = 0; i < 120; i++) {
                    const star = document.createElement('div');
                    star.classList.add('star');
                    const size = Math.random() * 3 + 1;
                    star.style.width = size + 'px';
                    star.style.height = size + 'px';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                    star.style.setProperty('--delay', (Math.random() * 5) + 's');
                    container.appendChild(star);
                }
            }
            createStars();

            const particleContainer = document.getElementById('bgParticles');
            const pColors = ['#9d4edd', '#00f0ff', '#7a4aaa', '#3af0ff', '#c084fc'];
            for (let i = 0; i < 45; i++) {
                const p = document.createElement('div');
                p.className = 'bg-particle';
                const size = Math.random() * 5 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.background = pColors[Math.floor(Math.random() * pColors.length)];
                p.style.animationDuration = (Math.random() * 16 + 10) + 's';
                p.style.animationDelay = (Math.random() * 14) + 's';
                p.style.boxShadow = '0 0 14px ' + p.style.background;
                particleContainer.appendChild(p);
            }

            // ==========================================================
            //  EVENT LISTENERS
            // ==========================================================
            document.getElementById('clearHistoryBtn').addEventListener('click', function() {
                const username = getCurrentUser();
                if (!username) return;
                if (confirm(`Clear all quiz history for "${username}"?`)) {
                    clearUserHistory(username);
                    renderDashboard();
                }
            });

            // ==========================================================
            //  INIT
            // ==========================================================
            const user = getCurrentUser();
            if (!user) return;

            renderDashboard();
            console.log('💻 CodeVerse Dashboard loaded.');
            console.log('👤 Logged in as:', user);
            console.log('📚 Clicking a subject card → instruction.html?subject=...');

        })();
    </script>

</body>
</html>
